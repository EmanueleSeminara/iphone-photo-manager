version: 2

updates:
  # Keeps the pinned action SHAs current. Without this, pinning would mean never
  # getting a security fix for an action.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: "chore"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: "chore"
    # pymobiledevice3 11.x has not been checked against this code, and the whole
    # device layer is written for the 10.x async API. A major bump here needs a
    # human with a phone, not an automatic merge.
    ignore:
      - dependency-name: pymobiledevice3
        update-types: ["version-update:semver-major"]
